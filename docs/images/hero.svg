<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 459" width="900" role="img" aria-labelledby="t d">
  <title id="t">Magi deliberation display</title>
  <desc id="d">A black and orange console in the style of the MAGI system display. Three blue panels sit in a triangle around the word MAGI: Codex CLI as BALTHASAR 2 at the top, Oh My Pi as CASPER 3 on the left, and Claude Code as MELCHIOR 1 on the right. Two input lines at the bottom show an access code and the question "Does the evidence support the claim?"</desc>
  <defs>
    <pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="12" fill="#ff8a00" opacity="0.16"/>
    </pattern>
    <style>
      .or { fill: #ff8a00; }
      .ol { fill: none; stroke: #ff8a00; }
      .cy { fill: #46b3da; }
      .gr { fill: none; stroke: #2f8a4a; stroke-width: 1.5; }
      .k { font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", "MS Mincho", "Songti SC", serif; font-weight: 900; letter-spacing: 6px; }
      .m { font-family: "Courier New", Consolas, monospace; fill: #ff8a00; }
      .u { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #000; text-anchor: middle; }
      .s { font-family: Georgia, "Times New Roman", serif; font-weight: 700; fill: #ff8a00; text-anchor: middle; }
    </style>
  </defs>

  <rect width="800" height="459" fill="#000"/>
  <rect x="3" y="3" width="794" height="453" fill="url(#hz)"/>
  <rect x="3" y="3" width="794" height="453" class="ol" stroke-width="2"/>
  <rect x="14" y="14" width="772" height="431" fill="#000" stroke="#ff8a00" stroke-width="1"/>

  <!-- headers -->
  <text x="125" y="88" class="k or" font-size="48" text-anchor="middle">質問</text>
  <text x="662" y="88" class="k or" font-size="48" text-anchor="middle">解決</text>
  <path class="gr" d="M24 35H277M24 41H277M24 99H277M24 105H277"/>
  <path class="gr" d="M524 35H777M524 41H777M524 99H777M524 105H777"/>

  <!-- readout -->
  <text x="34" y="138" class="m" font-size="22">CODE:473</text>
  <text x="66" y="153" class="m" font-size="10.5">FILE:MAGI_SYS</text>
  <text x="66" y="166" class="m" font-size="10.5">MODE:PEER</text>
  <text x="66" y="179" class="m" font-size="10.5">LEDGER:OPEN</text>
  <text x="66" y="192" class="m" font-size="10.5">PRIORITY:AAA</text>

  <!-- info stamp -->
  <rect x="678" y="143" width="84" height="47" fill="none" stroke="#46b3da" stroke-width="1"/>
  <rect x="682" y="147" width="76" height="39" fill="none" stroke="#46b3da" stroke-width="2"/>
  <text x="720" y="180" class="k" font-size="31" fill="#46b3da" text-anchor="middle" style="letter-spacing:2px">情報</text>

  <!-- units -->
  <path class="cy" stroke="#ff8a00" stroke-width="2" d="M278 33H523V205L468 252H333L278 205Z"/>
  <path class="cy" stroke="#ff8a00" stroke-width="2" d="M35 210H232L340 285V387H35Z"/>
  <path class="cy" stroke="#ff8a00" stroke-width="2" d="M568 210H766V387H463V285Z"/>

  <text x="400" y="132" class="u" font-size="25">CODEX CLI</text>
  <text x="400" y="156" class="u" font-size="17">BALTHASAR • 2</text>
  <text x="400" y="176" class="u" font-size="11" font-weight="400">sandboxed reviewer</text>

  <text x="187" y="300" class="u" font-size="25">OH MY PI</text>
  <text x="187" y="324" class="u" font-size="17">CASPER • 3</text>
  <text x="187" y="344" class="u" font-size="11" font-weight="400">advisor on the worker</text>

  <text x="615" y="300" class="u" font-size="25">CLAUDE CODE</text>
  <text x="615" y="324" class="u" font-size="17">MELCHIOR • 1</text>
  <text x="615" y="344" class="u" font-size="11" font-weight="400">live session peer</text>

  <!-- connectors -->
  <path d="M290 249L310 228M510 249L490 228" stroke="#ff8a00" stroke-width="5"/>
  <path d="M340 320H463" stroke="#ff8a00" stroke-width="5"/>
  <text x="400" y="284" class="s" font-size="27" style="letter-spacing:1px">MAGI</text>
  <text x="400" y="344" class="m" font-size="10" text-anchor="middle">EVIDENCE</text>
  <text x="400" y="358" class="m" font-size="10" text-anchor="middle">&gt; REASONING</text>
  <text x="400" y="372" class="m" font-size="10" text-anchor="middle">&gt; AGREEMENT</text>

  <!-- input lines -->
  <text x="20" y="415" class="m" font-size="11">access code:</text>
  <rect x="97" y="406" width="683" height="14" fill="none" stroke="#ff8a00" stroke-width="1"/>
  <text x="101" y="417" class="m" font-size="9">••••••••••••••••••••••••••••••••••••••••••••••••••</text>
  <text x="20" y="433" class="m" font-size="11">question:</text>
  <rect x="97" y="424" width="683" height="14" fill="none" stroke="#ff8a00" stroke-width="1"/>
  <text x="101" y="435" class="m" font-size="9.5">Does the evidence support the claim?</text>
  <rect x="310" y="427" width="5" height="8" fill="#ff8a00"/>
</svg>
